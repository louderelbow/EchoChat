# EchoChat 生产部署示例（nginx）
#
# 要点说明：
# 1) 前端路由与网关 API 路径同名（/login、/register 等），同域会冲突，
#    因此建议「前端」和「网关」用两个域名分别对外：
#       - web.example.com  -> 托管前端 dist（静态资源）
#       - api.example.com  -> 反向代理到网关（含 WebSocket /wss）
# 2) 前端构建前设置 web/chat-server/.env.production：
#       VUE_APP_BACKEND_URL=https://api.example.com
#       VUE_APP_WS_URL=wss://api.example.com
# 3) 网关可用 `ECHO_TLS=off` 关闭自带 TLS，由 nginx 终结 TLS，网关只监听明文 8888。
#    （若保留网关自带 TLS，请把下面 proxy_pass 改成 https://127.0.0.1:8888
#      并加上 proxy_ssl_verify off;）
# 4) 别忘了在 etc/echo-api.yaml 的 WsAllowedOrigins 里加入前端域名，否则 WS 会被拒。
# 5) 把 web.example.com / api.example.com 和证书路径替换成你自己的。

# ---------- 前端静态站点 ----------
server {
    listen 443 ssl;
    server_name web.example.com;

    ssl_certificate     /etc/nginx/ssl/web.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/web.example.com.key;

    root  /var/www/echochat/dist;
    index index.html;

    # 前端为 history 模式路由，未命中的路径统一回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# ---------- 网关（HTTP API + WebSocket） ----------
server {
    listen 443 ssl;
    server_name api.example.com;

    ssl_certificate     /etc/nginx/ssl/api.example.com.crt;
    ssl_certificate_key /etc/nginx/ssl/api.example.com.key;

    # 与网关 MaxBytes(60MB) 对齐，避免大文件上传被 nginx 拦掉
    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（/wss）升级握手所需
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 语音/视频通话与长连接：放宽超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
