#################################################
######### 		instance conf			#############
#################################################
# mysql serverId，需与 MySQL 主库的 server_id 不同
canal.instance.mysql.slaveId=1234

# enable gtid use true/false
canal.instance.gtidon=false

# position info：容器网络内使用 compose 服务名寻址
canal.instance.master.address=mysql:3306
canal.instance.master.journal.name=
canal.instance.master.position=
canal.instance.master.timestamp=
canal.instance.master.gtid=

# rds oss binlog
canal.instance.rds.accesskey=
canal.instance.rds.secretkey=
canal.instance.rds.instanceId=

# table meta tsdb info
canal.instance.tsdb.enable=true

# username/password（本地开发默认 root/123456，与 docker-compose 中 MySQL 一致）
canal.instance.dbUsername=root
canal.instance.dbPassword=123456
canal.instance.connectionCharset=UTF-8
# 是否为 druid 加密密码
canal.instance.enableDruid=false

# table regex：只订阅与缓存相关的 4 张表（message 表由聊天消费者增量维护，无需 binlog 失效）
canal.instance.filter.regex=echo_chat\\.(user_info|group_info|user_contact|session)
# table black regex
canal.instance.filter.black.regex=

# mq topic：实际是发送到 RabbitMQ 时使用的 routingKey（与 canal.properties 的 rabbitmq.routingKey 对齐）
canal.mq.topic=echo.canal

#################################################
######### 		canal instance end		#############
#################################################
