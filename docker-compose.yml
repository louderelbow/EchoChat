services:
  mysql:
    image: mysql:8.0
    container_name: echo-gozero-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-123456}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-echo_chat}"
    # server-id 供 Canal（binlog 订阅）作为从库标识使用；MySQL 8 默认已开启 binlog 且为 ROW 格式
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --server-id=1
    ports:
      - "3306:3306"
    volumes:
      - ./schema/echo.sql:/docker-entrypoint-initdb.d/echo.sql:ro
      - echo-mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: echo-gozero-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: echo-gozero-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS:-guest}"
    ports:
      - "5672:5672"
      - "15672:15672"

  # etcd：网关节点注册/发现。用租约(lease)+keepalive 标记节点存活，
  # 节点消失时 rpc 通过 Watch 立即清理其残留路由（比等路由 TTL 过期更快）。
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: echo-gozero-etcd
    environment:
      - ETCD_NAME=etcd-echo
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER=etcd-echo=http://0.0.0.0:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
    ports:
      - "2379:2379"
    volumes:
      - echo-etcd-data:/etcd-data

  # Canal（阿里开源 binlog 订阅中间件）：解析 MySQL binlog 并把变更投递到 RabbitMQ，
  # Go 侧的缓存失效消费者据此精准删除 Redis 缓存，替代原先散落在业务代码里的手动失效。
  canal-server:
    image: canal/canal-server:v1.1.7
    container_name: echo-gozero-canal
    depends_on:
      - mysql
      - rabbitmq
    ports:
      - "11111:11111"
    volumes:
      - ./deploy/canal/canal.properties:/home/admin/canal-server/conf/canal.properties
      - ./deploy/canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties

  # Elasticsearch（含 IK 中文分词），用于聊天记录全文检索
  es:
    build: ./deploy/es
    image: echo-gozero-es:8.15.2
    container_name: echo-gozero-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - echo-es-data:/usr/share/elasticsearch/data

volumes:
  echo-mysql-data:
  echo-es-data:
  echo-etcd-data:
